[project]
name = "rezur-saves-configurator"
version = "0.1.0"
description = "Rezur Saves Configurator — konfigurator i naprawiacz save'ów Elden Ring (.sl2): diagnostyka, auto-naprawy, kopiowanie postaci, patcher SteamID"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
rezur = "rezur.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "rezur",
    "rezur.core",
    "rezur.games",
    "rezur.diag",
    "rezur.fixes",
    "rezur.ops",
    "rezur.report",
    "rezur.api",
]
